name: 提交社区插件
description: 申请将你的 WhaleLife 插件收录进公开目录。
title: "[收录] "
body:
  - type: markdown
    attributes:
      value: |
        新投稿请先用 WhaleLife 打包工具生成 `.wlpkg.gz`，上传到插件自己公开仓库中对应版本的正式 GitHub Release。提交下方表单时，请复制该安装包附件的下载链接。

        请在发行说明中列出附件字节数、SHA-256、适用的 WhaleLife 版本、系统、架构和必需插件版本。维护者会下载同一附件，在独立环境试装。[打包命令与格式说明](https://github.com/iinukami/whalelife/blob/main/market/community-packages.md#作者打包)

        已经开帖但尚未提供安装包的投稿会保留待补件状态。请在仍开放的投稿 Issue 补充附件链接。

        已收录插件发新版后请在主仓[提交新版复审](https://github.com/iinukami/whalelife/issues/new?template=review-plugin-update.yml)；同一版本已有开放审核帖时在该帖补充资料。只换图标可[申请单独审图](https://github.com/iinukami/whalelife/issues/new?template=review-plugin-icon.yml)。
  - type: input
    id: repository
    attributes:
      label: 插件的公开 GitHub 仓库
      placeholder: https://github.com/作者/插件仓库
    validations:
      required: true
  - type: input
    id: package-url
    attributes:
      label: 正式发行包下载链接（.wlpkg.gz）
      description: 在该版本的 Release 页面找到 Assets，复制 .wlpkg.gz 附件的下载链接。源码归档或 Release 页面地址不能用于商店试装。
      placeholder: https://github.com/作者/插件仓库/releases/download/v1.2.0/my-plugin-1.2.0.wlpkg.gz
    validations:
      required: true
  - type: textarea
    id: introduction
    attributes:
      label: 一句话介绍
      description: 说说插件能做什么。如果有偏好的署名或单独的安装文档，也可以写在这里。
    validations:
      required: true
  - type: input
    id: icon
    attributes:
      label: 插件图标链接（选填）
      description: 把 PNG 图片放在上面填写的插件仓库里，再粘贴图片文件的 GitHub 链接。推荐 256 × 256 像素的方图，最大 1 MiB，每边不超过 1024 像素。留空会使用默认图标。
      placeholder: https://github.com/作者/插件仓库/blob/main/icon.png
    validations:
      required: false
